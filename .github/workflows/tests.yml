name: Python unit and smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Unit tests (no API keys needed)
        run: python -m unittest discover -s tests -v
      - name: Offline smoke test
        run: |
          consensustree doctor
          consensustree quickstart --dir quickstart-check
          consensustree review examples --dry-run
          consensustree benchmark --suite benchmarks/suite.json --reports benchmarks/fixtures
      - name: Validation harness offline smoke (NO provider calls)
        run: |
          python -m consensustree.validation live --output live-status.json
          python -m consensustree.validation accuracy --output accuracy-status.json
      - name: Studio help and offline showcase smoke
        run: |
          consensustree studio --help
          python -m compileall -q scripts
          python -c "from pathlib import Path; assert Path('examples/interactive_showcase.html').stat().st_size > 0"
      - name: Build distribution
        run: python -m pip wheel --no-deps -w build-wheel .
